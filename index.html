<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SDF Sandbox</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
    {
      "imports": {
        "nipplejs": "https://esm.sh/nipplejs@0.10.1"
      }
    }
    </script>
</head>
<body>
    <canvas id="gl-canvas"></canvas>

    <div id="loading-screen" class="overlay">
        <div class="loader-content">
            <h1>SDF Planet</h1>
            <p id="loading-label">Booting...</p>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </div>
    </div>

    <div id="ui-root">
        <div id="hud-top-left" class="hud-panel">
            <div>FPS: <span id="fps-counter" class="mono">0</span></div>
            <div>Edits: <span id="edit-counter" class="mono">0</span></div>
            <div class="quality-selector">
                <label>Quality:</label>
                <select id="quality-select">
                    <option value="0.35">Potato</option>
                    <option value="0.5" selected>Low</option>
                    <option value="0.75">Medium</option>
                    <option value="1.0">High</option>
                </select>
            </div>
        </div>

        <div id="crosshair"></div>

        <div id="action-bar">
            <!-- Buttons injected by ui.js -->
        </div>

        <div id="hint-panel" class="desktop-only">
            <div>L-Click: <span class="emerald">add</span> · R-Click: <span class="rose">sub</span></div>
            <div>Scroll: dist · E+Mouse: rot · E+Shift+Mouse: scale</div>
        </div>

        <div id="click-to-play" class="overlay hidden">
            <div class="modal">
                <h2>SDF Planet</h2>
                <p>WASD: Move · Space/Shift: Up/Down</p>
                <p>Mouse: Look · 1-4: Shapes · E: Modify</p>
                <p style="margin-top:20px; opacity:0.8; font-size: 0.9em;" class="emerald">Click or press ESC to resume</p>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v833ccba57c9e4d2798f2e76cebdd09a11778172276447" integrity="sha512-57MDmcccJXYtNnH+ZiBwzC4jb2rvgVCEokYN+L/nLlmO8rfYT/gIpW2A569iJ/3b+0UEasghjuZH/ma3wIs/EQ==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
